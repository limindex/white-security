# White Security CI: push·pull_request 때 품질 검사만 한다. 일정 실행·알림·자동 이슈 생성은 없다.
# 포크 PR 도 안전하게: pull_request(읽기 전용 토큰, 비밀값 없음)만 쓰고 pull_request_target·workflow_run 은 쓰지 않는다.
# 액션은 40자리 커밋 SHA 로 고정한다(주석의 버전은 사람이 읽는 용도). 갱신할 때도 SHA 로 바꾼다.
# 같은 검사를 로컬에서: 아래 run: 줄을 저장소 루트에서 그대로 실행. 금지어 검사(scripts/check-forbidden.php)는 목록이 로컬에만 있으므로 push 전에 로컬에서 따로 실행.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          # 버전 올림 검사가 기준 커밋(PR base·push 이전 커밋)을 읽는다
          fetch-depth: 0

      # 러너 기본 PHP 는 8.3 이라 프로젝트 기준인 8.4 를 설치한다(도구·커버리지 없음)
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring
          coverage: none
          tools: none

      - name: PHP syntax (php -l)
        run: |
          status=0
          while IFS= read -r -d '' f; do
            out="$(php -l "$f" 2>&1)" || { echo "$out"; status=1; }
          done < <(git ls-files -z -- '*.php')
          exit "$status"

      # 플러그인 폴더 검사(심링크·하드링크·실행 권한·git 모드 100644·allowed-tools 정확히 한 줄·훅/MCP 없음)는 tests/PluginTest.php 에 있다
      - name: Tests
        run: php tests/run.php

      - name: Generated files are committed
        run: |
          out="$(mktemp -d)"
          php build.php --out="$out" --today="$(date -u +%F)"
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error::php build.php output differs from the committed files. Run php build.php locally and commit the generated files."
            exit 1
          fi
          git diff --exit-code

      - name: Hidden Unicode characters
        run: php scripts/check-hidden-chars.php

      - name: Code example syntax
        run: php scripts/check-code-examples.php

      - name: Plugin version bump
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: php scripts/check-version-bump.php "$BASE_SHA"

      # 금지어 목록은 저장소에 없다(.gitignore). CI 에서는 내용 없이 건너뛰었다는 한 줄만 찍힌다.
      - name: Forbidden words (local list only)
        run: php scripts/check-forbidden.php
